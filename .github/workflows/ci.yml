name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform: # required status check: `platform / checks`
    name: platform
    permissions:
      contents: read
    uses: janclem/agent-platform/.github/workflows/checks.yml@b8a6abce7186d84450837851522fce4f9058414c # v1.3.0
